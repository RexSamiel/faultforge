[tool.uv.workspace]
members = ["faultforge", "experiments/encoded_memory"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.2",
    "ruff>=0.12.4",
    "ty>=0.0.49",
]

[tool.ty.rules]
missing-override-decorator = "warn"

[tool.ruff]
target-version = "py314"
